[project]
name = "albassist"
version = "0.1.0"
description = "PC 端 AI 助视学习软件 - 面向白化病低视力中小学生"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Albassist Team" }]

dependencies = [
    "PySide6>=6.8,<6.13",
    "opencv-python>=4.10,<4.11",
    "numpy>=2.0,<3.0",
    "structlog>=24.0",
    "rapidocr-onnxruntime>=1.2.3",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=3.2,<4",
    "paddlepaddle>=3.0,<4",
]


dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]
build = [
    "pyinstaller>=6.0",
]
tts = [
    "pyttsx3>=2.90",
]

[project.scripts]
albassist = "albassist.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albassist"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["albassist"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
packages = ["albassist"]

[[tool.mypy.overrides]]
module = ["cv2.*", "paddleocr.*", "rapidocr_onnxruntime.*", "onnxruntime.*", "pyttsx3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["albassist.presentation.*"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["albassist.app.composition_root", "albassist.app.main"]
disable_error_code = ["type-abstract", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["albassist"]

[[tool.importlinter.contracts]]
name = "Domain layer is pure"
type = "forbidden"
source_modules = ["albassist.domain"]
forbidden_modules = ["cv2", "numpy", "PySide6", "sqlite3", "paddleocr", "rapidocr_onnxruntime", "onnxruntime", "albassist.vision", "albassist.infrastructure", "albassist.presentation", "albassist.ocr_runtime"]

[[tool.importlinter.contracts]]
name = "Application does not import adapters"
type = "forbidden"
source_modules = ["albassist.application"]
forbidden_modules = ["cv2", "numpy", "PySide6", "sqlite3", "paddleocr", "rapidocr_onnxruntime", "onnxruntime", "albassist.vision", "albassist.infrastructure", "albassist.presentation", "albassist.ocr_runtime"]

[[tool.importlinter.contracts]]
name = "Layers dependency direction"
type = "layers"
layers = [
    "albassist.app",
    "albassist.presentation",
    "albassist.application",
    "albassist.domain",
]